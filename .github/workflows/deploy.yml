name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repo > Settings > Secrets and variables > Actions > Variables
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://iguana-resource-system-production.up.railway.app' }}
          # Públicas por diseño (URL y anon key de Supabase): van como Variables, no como Secrets
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Publica dist/ en la rama gh-pages (Pages > Source: Deploy from a branch > gh-pages / root)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
